<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rably · Shops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{
  --ink:#141A3D;        /* Rably navy */
  --ink-2:#2A3266;
  --paper:#F5F6FA;
  --card:#FFFFFF;
  --line:#DFE2EC;
  --muted:#5C6483;
  --focus:#3D5AFE;
  --s-new:#A7AEC6;
  --s-in_progress:#D99A1E;
  --s-done:#23875A;
  --s-cancelled:#4B5163;
  --s-rejected:#C23B3B;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- gate screens ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-box{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
.brand{font-weight:700;font-size:26px;letter-spacing:.06em;color:var(--ink)}
.brand small{display:block;font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted)}
.gate h1{font-size:20px;margin:18px 0 6px}
.gate p{color:var(--muted);margin:0 0 16px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;color:var(--ink-2)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:84px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--ink-2)}
.btn.danger{color:var(--s-rejected)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--s-rejected);font-size:14px;min-height:1.4em;margin-top:8px}

/* ---------- top bar ---------- */
header.top{background:var(--ink);color:#fff;padding:0 20px;height:58px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:30}
header.top .brand{color:#fff;font-size:20px}
header.top .brand small{display:inline;color:#AFB6D6;margin-inline-start:10px;font-size:13px}
nav.tabs{display:flex;gap:4px;margin-inline-start:12px}
nav.tabs button{background:none;border:0;color:#C9CEE6;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}
nav.tabs button[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff}
.top .spacer{flex:1}
.top .me{font-size:13px;color:#C9CEE6}
.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25);padding:6px 10px}

main{padding:20px;max-width:1400px;margin:0 auto}

/* ---------- pipeline (signature element) ---------- */
.pipeline{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;margin-bottom:16px}
.pipe-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.pipe-head .total{font-size:28px;font-weight:700}
.pipe-head .lbl{color:var(--muted)}
.pipe-bar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:#EEF0F6}
.pipe-bar span{display:block;height:100%;transition:flex-grow .4s ease}
.pipe-legend{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.pipe-legend button{text-align:start;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer}
.pipe-legend button:hover{border-color:var(--line)}
.pipe-legend button[aria-pressed="true"]{border-color:var(--ink);background:#F2F3F9}
.pipe-legend .k{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.pipe-legend .v{font-size:22px;font-weight:700;margin-top:2px}
.pipe-legend .p{font-size:12px;color:var(--muted);margin-inline-start:4px;font-weight:500}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 240px;width:auto}
.toolbar select{width:auto;min-width:150px}
.toolbar .grow{flex:1}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:10px}
.bulk select{width:auto;min-width:160px;color:var(--ink)}
.bulk .btn{padding:6px 12px}

/* ---------- table ---------- */
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600;background:#FAFBFD;position:sticky;top:0;z-index:1;cursor:pointer;user-select:none}
th.nosort{cursor:default}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F7F8FC}
td .name{font-weight:600}
td .sub{font-size:12.5px;color:var(--muted)}
td.nw{white-space:nowrap}
td.chk,th.chk{width:36px;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:#F1F2F7;white-space:nowrap}
.unassigned{color:var(--muted);font-style:italic}
.more{display:flex;justify-content:center;padding:14px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

/* ---------- map ---------- */
#map{height:calc(100vh - 290px);min-height:420px;border-radius:14px;border:1px solid var(--line)}

/* ---------- team ---------- */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.agent{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.agent h3{margin:0;font-size:17px}
.agent .meta{font-size:13px;color:var(--muted)}
.agent .mini{display:flex;height:8px;border-radius:999px;overflow:hidden;background:#EEF0F6;margin:12px 0 8px}
.agent .counts{display:flex;flex-wrap:wrap;gap:10px;font-size:13px}
.agent .counts span{display:inline-flex;align-items:center;gap:5px}
.agent .actions{display:flex;gap:6px;margin-top:12px}
.agent.off{opacity:.55}

/* ---------- drawer & modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,26,61,.35);z-index:40}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(520px,100%);background:var(--card);z-index:41;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(20,26,61,.18)}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer header h2{margin:0;font-size:19px;flex:1}
.drawer .body{padding:6px 20px 20px;overflow:auto;flex:1}
.drawer footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.status-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.status-pick button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 4px;cursor:pointer;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.status-pick button[aria-pressed="true"]{border-color:var(--ink);background:#F2F3F9;box-shadow:inset 0 0 0 1px var(--ink)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:14px 0;padding:12px 14px;background:#FAFBFD;border-radius:10px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;word-break:break-word}
.facts a{color:var(--focus)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.history{margin-top:18px}
.history h3{font-size:14px;margin:0 0 8px}
.history ol{list-style:none;margin:0;padding:0;border-inline-start:2px solid var(--line)}
.history li{padding:4px 12px 8px;font-size:13px;position:relative}
.history li::before{content:"";position:absolute;inset-inline-start:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.history time{color:var(--muted);display:block;font-size:12px}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:42;padding:20px}
.modal .box{background:var(--card);border-radius:14px;width:min(520px,100%);padding:22px;max-height:90vh;overflow:auto}
.modal h2{margin:0 0 6px;font-size:19px}
.modal p{color:var(--muted);margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:#FAFBFD;border:1px solid var(--line);border-radius:10px;padding:10px}
.stats b{display:block;font-size:22px}
.stats span{font-size:13px;color:var(--muted)}
.row-end{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.progress{height:6px;background:#EEF0F6;border-radius:999px;overflow:hidden;margin-top:12px}
.progress span{display:block;height:100%;background:var(--ink);width:0;transition:width .2s}
.nearbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#EEF1FF;border:1px solid #C9D2FF;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.nearbar select{width:auto;padding:5px 8px}
.nearbar .btn{padding:5px 10px}
.grp{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#EEF1FF;color:#2A3266;white-space:nowrap}
.dupopt{display:flex;gap:10px;align-items:flex-start;background:#FAFBFD;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;cursor:pointer}
.dupopt input{width:auto;margin-top:4px}
.dupopt b{display:block}
.dupopt small{color:var(--muted)}
.duplist{font-size:13px;color:var(--muted);margin:6px 0 0;padding-inline-start:18px;max-height:140px;overflow:auto}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-weight:600}
[dir=rtl] .toast{transform:translateX(50%)}

@media (max-width:800px){
  header.top{flex-wrap:wrap;height:auto;padding:10px 14px;gap:8px}
  nav.tabs{order:3;width:100%;margin:0}
  .top .me{display:none}
  main{padding:14px}
  .pipe-legend{grid-template-columns:repeat(3,1fr)}
  .status-pick{grid-template-columns:repeat(3,1fr)}
  .toolbar select{flex:1 1 140px;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- Setup: shown only when firebase-config.js still holds placeholders -->
<section id="setup" class="gate hidden">
  <div class="gate-box">
    <div class="brand">RABLY<small data-t="appName"></small></div>
    <h1 data-t="setupTitle"></h1>
    <p data-t="setupText"></p>
    <label for="cfgText" data-t="setupLabel"></label>
    <textarea id="cfgText" dir="ltr" style="min-height:160px;font-size:13px" placeholder='{ "apiKey": "...", "authDomain": "...", "projectId": "..." }'></textarea>
    <div class="err" id="cfgErr"></div>
    <button class="btn primary" id="cfgSave" data-t="setupSave"></button>
  </div>
</section>

<!-- Login -->
<section id="login" class="gate hidden">
  <form class="gate-box" id="loginForm">
    <div class="brand">RABLY<small data-t="appName"></small></div>
    <h1 data-t="signIn"></h1>
    <p data-t="signInText"></p>
    <label for="email" data-t="email"></label>
    <input id="email" type="email" dir="ltr" autocomplete="username" required>
    <label for="password" data-t="password"></label>
    <input id="password" type="password" dir="ltr" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn primary" type="submit" data-t="signIn"></button>
      <span class="grow" style="flex:1"></span>
      <button class="btn ghost" type="button" data-lang-toggle></button>
    </div>
  </form>
</section>

<!-- App -->
<div id="app" class="hidden">
  <header class="top">
    <div class="brand">RABLY<small data-t="appName"></small></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="list" aria-selected="true" data-t="tabList"></button>
      <button role="tab" data-tab="map" aria-selected="false" data-t="tabMap"></button>
      <button role="tab" data-tab="team" aria-selected="false" data-t="tabTeam"></button>
    </nav>
    <span class="spacer"></span>
    <span class="me" id="me"></span>
    <button class="btn" data-lang-toggle></button>
    <button class="btn" id="logout" data-t="signOut"></button>
  </header>

  <main>
    <section class="pipeline" aria-label="Status overview">
      <div class="pipe-head"><span class="total num" id="pTotal">0</span><span class="lbl" id="pLbl"></span></div>
      <div class="pipe-bar" id="pBar"></div>
      <div class="pipe-legend" id="pLegend"></div>
    </section>

    <div class="toolbar" id="toolbar">
      <input type="search" id="q" data-tp="searchPh">
      <select id="fAgent"></select>
      <select id="fCat"></select>
      <select id="fZone"></select>
      <select id="fArea"></select>
      <select id="fGroup"></select>
      <select id="gRadius" aria-label="radius"></select>
      <span class="grow"></span>
      <button class="btn primary" id="btnAdd" data-t="addRestaurant"></button>
      <button class="btn" id="btnImport" data-t="importExcel"></button>
      <button class="btn" id="btnExport" data-t="exportExcel"></button>
      <button class="btn" id="btnDedup" data-t="dedupDb"></button>
      <input type="file" id="fileIn" accept=".xlsx,.xls,.csv" class="hidden">
    </div>
    <div class="nearbar hidden" id="nearbar"></div>

    <section id="view-list">
      <div class="bulk hidden" id="bulk">
        <strong id="bulkCount"></strong>
        <select id="bulkAgent"></select>
        <button class="btn" id="bulkAssign" data-t="assign"></button>
        <select id="bulkStatus"></select>
        <button class="btn" id="bulkSetStatus" data-t="setStatus"></button>
        <span style="flex:1"></span>
        <button class="btn ghost" style="color:#fff" id="bulkClear" data-t="clearSel"></button>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th class="chk nosort"><input type="checkbox" id="chkAll" aria-label="Select all"></th>
            <th data-sort="number">#</th>
            <th data-sort="name" data-t="colName"></th>
            <th data-sort="area" data-t="colArea"></th>
            <th data-sort="group" data-t="colGroup"></th>
            <th data-sort="phone" class="nosort" data-t="colPhone"></th>
            <th data-sort="rating" data-t="colRating"></th>
            <th data-sort="agent" data-t="colAgent"></th>
            <th data-sort="status" data-t="colStatus"></th>
            <th data-sort="updatedAt" data-t="colUpdated"></th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="emptyList" class="empty hidden"></div>
        <div class="more hidden" id="moreWrap"><button class="btn" id="btnMore"></button></div>
      </div>
    </section>

    <section id="view-map" class="hidden"><div id="map"></div></section>

    <section id="view-team" class="hidden">
      <div class="toolbar"><span class="grow"></span><button class="btn primary" id="btnAddAgent" data-t="addAgent"></button></div>
      <div class="team-grid" id="team"></div>
    </section>
  </main>
</div>

<div id="overlay"></div>

function areaOf(r){
  if (r.area) return r.area;
  const parts = String(r.address||"").split(",").map(s=>s.trim()).filter(Boolean);
  const i = parts.findIndex(p=>/^damascus$|^دمشق$/i.test(p));
  let a = i>0 ? parts[i-1] : (parts.length>=3 ? parts[parts.length-3] : "");
  if (/^[A-Z0-9]{4}\+[A-Z0-9]{2,3}$/.test(a)) a = ""; // plus-code only
  return a;
}

/* ---------- geography: distance, nearby groups ---------- */
const hasGeo = r => Number.isFinite(r.latitude) && Number.isFinite(r.longitude);
function distM(a,b){ // haversine, metres
  const R=6371000, toR=Math.PI/180, dLat=(b.latitude-a.latitude)*toR, dLng=(b.longitude-a.longitude)*toR;
  const h=Math.sin(dLat/2)**2+Math.cos(a.latitude*toR)*Math.cos(b.latitude*toR)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtDist = m => m<1000 ? `${Math.round(m/10)*10} ${t("m")}` : `${(m/1000).toFixed(1)} ${t("km")}`;
const RADII = [100,200,300,500,1000];
// Grid index so "who is within R metres" is fast even for thousands of shops.
function gridIndex(pts, cell){
  const g=new Map(), key=(x,y)=>x+","+y;
  const xy = r => [Math.floor(r.longitude*111320*Math.cos(33.5*Math.PI/180)/cell), Math.floor(r.latitude*110540/cell)];
  for (const r of pts){ const [x,y]=xy(r); const k=key(x,y); (g.get(k)||g.set(k,[]).get(k)).push(r); }
  return { around(r){ const [x,y]=xy(r), out=[]; for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){ const c=g.get(key(x+i,y+j)); if(c) out.push(...c); } return out; } };
}
// Nearby groups: repeatedly take the shop with the most neighbours within R and group every
// ungrouped shop within R of it. Each group is a walkable cluster (at most 2R across).
let groupCache = {src:null, radius:0, of:new Map(), list:[]};
function nearbyGroups(){
  if (groupCache.src===state.restaurants && groupCache.radius===state.radius) return groupCache;
  const R = state.radius, pts=[...state.restaurants.values()].filter(hasGeo), idx=gridIndex(pts,R);
  const nb = new Map(pts.map(p=>[p.id, idx.around(p).filter(q=>distM(p,q)<=R)]));
  const order = [...pts].sort((a,b)=>nb.get(b.id).length-nb.get(a.id).length || String(a.id).localeCompare(String(b.id)));
  const taken = new Set(), raw=[];
  for (const p of order){
    if (taken.has(p.id)) continue;
    const members = nb.get(p.id).filter(q=>!taken.has(q.id));
    members.forEach(q=>taken.add(q.id));
    raw.push({center:p, members});
  }
  const multi = raw.filter(g=>g.members.length>1).sort((a,b)=>b.members.length-a.members.length);
  const of = new Map(), list=[];
  multi.forEach((g,i)=>{
    const id = "g"+(i+1);
    const areas={}; g.members.forEach(m=>{ const a=m._area||m.zone; if(a) areas[a]=(areas[a]||0)+1; });
    const area = Object.entries(areas).sort((a,b)=>b[1]-a[1])[0]?.[0] || "";
    list.push({id, n:i+1, area, size:g.members.length, center:g.center});
    g.members.forEach(m=>of.set(m.id,{id, n:i+1}));
  });
  raw.filter(g=>g.members.length===1).forEach(g=>of.set(g.members[0].id,{id:"iso", n:Infinity}));
  return groupCache = {src:state.restaurants, radius:R, of, list};
}
const groupOf = r => nearbyGroups().of.get(r.id) || null;

/* ---------- duplicate detection ---------- */
const normName = s => String(s||"").toLowerCase().normalize("NFKC").replace(/[ً-ٟـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[^\p{L}\p{N}]+/gu,"");
const cidOf = r => (String(r.google_maps_url||"").match(/[?&]cid=(\d+)/)||[])[1] || "";
const phoneKey = s => String(s||"").replace(/\D/g,"").slice(-8);
// Two records are the same shop if they share a Google Maps cid / place_id, or have the same
// name and are within 75 m of each other (or share a phone number, or both lack coordinates).
function makeMatcher(){
  const byCid=new Map(), byPid=new Map(), byName=new Map();
  return {
    add(r,val=r){ const c=cidOf(r); if(c&&!byCid.has(c)) byCid.set(c,val); if(r.place_id&&!byPid.has(r.place_id)) byPid.set(r.place_id,val);
      const n=normName(r.name); if(n) (byName.get(n)||byName.set(n,[]).get(n)).push([r,val]); },
    find(r){
      const c=cidOf(r); if(c&&byCid.has(c)) return byCid.get(c);
      if(r.place_id&&byPid.has(r.place_id)) return byPid.get(r.place_id);
      const cands = byName.get(normName(r.name))||[];
      for (const [o,val] of cands){
        if (hasGeo(r)&&hasGeo(o)){ if (distM(r,o)<=75) return val; continue; }
        const pa=phoneKey(r.phone), pb=phoneKey(o.phone);
        if (pa&&pb){ if(pa===pb) return val; continue; }
        if (!hasGeo(r)&&!hasGeo(o)) return val;
      }
      return null;
    }
  };
}

   ========================================================= */
function baseFiltered(){ // all filters except status (pipeline shows distribution across statuses)
  const q = state.q.trim().toLowerCase();
  const mine = state.fAgent==="__mine" ? myAgentId() : null;
  return [...state.restaurants.values()].filter(r=>{
    if (state.fAgent==="__none" && r.assignedTo) return false;
    if (state.fAgent==="__mine" && r.assignedTo!==mine) return false;
    if (state.fAgent && !state.fAgent.startsWith("__") && r.assignedTo!==state.fAgent) return false;
    if (state.fCat && !typesOf(r).includes(state.fCat)) return false;
    if (state.fZone && r.zone!==state.fZone) return false;
    if (state.fArea && r._area!==state.fArea) return false;
    if (state.fGroup && groupOf(r)?.id!==state.fGroup) return false;
    if (state.near){ if(!hasGeo(r) || distM(state.near,r)>state.near.r) return false; }
    if (q){
      const hay = [r.name,r.phone,r.international_phone,r.address,r.category,r.types,r._area,r.zone,r.number].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function filtered(){
  const base = baseFiltered();
  const list = state.fStatus ? base.filter(r=>(r.status||"new")===state.fStatus) : base;
  const {key,dir} = state.sort;
  const val = r => key==="_dist"? distM(state.near,r) : key==="agent"? agentName(r.assignedTo) : key==="area"? r._area : key==="group"? (groupOf(r)?.n ?? null) : key==="status"? STATUSES.indexOf(r.status||"new") : key==="updatedAt"? toMs(r.updatedAt) : r[key];
  list.sort((a,b)=>{ const x=val(a), y=val(b);
    if (x==null||x===""||x===Infinity) return 1; if (y==null||y===""||y===Infinity) return -1;
    return (typeof x==="number"&&typeof y==="number" ? x-y : String(x).localeCompare(String(y),LANG)) * dir; });
  return {base,list};
}

  $("#fZone").innerHTML = opt("",t("allZones"),state.fZone) + zones.map(z=>opt(z,z,state.fZone)).join("");
  show("#fZone", zones.length>0);

async function updateRestaurant(id, changes){
  const r = state.restaurants.get(id); if(!r) return;
  const diffs = Object.entries(changes).filter(([k,v])=> (r[k]??null) !== (v??null));
  if (!diffs.length) return false;
  const by = state.user.email;
  await updateDoc(doc(RCOL,id), {...changes, updatedAt:serverTimestamp(), updatedBy:by});
  const hcol = collection(db,"restaurants",id,"history");
  await Promise.all(diffs.map(([k,v])=>addDoc(hcol,{at:serverTimestamp(),by,field:k,from:r[k]??null,to:v??null})));
  return true;
}
async function bulkUpdate(ids, changes){
  const by = state.user.email; let batch = writeBatch(db), n = 0;
  for (const id of ids){
    const r = state.restaurants.get(id); if(!r) continue;
    const diffs = Object.entries(changes).filter(([k,v])=>(r[k]??null)!==(v??null)); if(!diffs.length) continue;
    batch.update(doc(RCOL,id), {...changes, updatedAt:serverTimestamp(), updatedBy:by}); n++;
    for (const [k,v] of diffs){ batch.set(doc(collection(db,"restaurants",id,"history")), {at:serverTimestamp(),by,field:k,from:r[k]??null,to:v??null}); n++; }
    if (n>=400){ await batch.commit(); batch = writeBatch(db); n=0; }
  }
  if (n) await batch.commit();
}

   Excel import / export, starter data
   ========================================================= */
const normKey = s => String(s??"").trim().toLowerCase().replace(/\s+/g,"_");
const same = (a,b) => (a??null)===(b??null) || (typeof a==="number" && typeof b==="number" && Math.abs(a-b)<1e-6);
function cleanRow(raw){
  const o = {};
  for (const [k0,v0] of Object.entries(raw)){
    let k = normKey(k0); if (k==="status") k="gstatus"; k = ALIASES[k] || k;
    if (!EXCEL_FIELDS.includes(k) || o[k]!=null) continue;
    let v = v0; if (typeof v==="string"){ v=v.trim(); if(v==="") v=null; }
    if (v!=null && NUMERIC.has(k)){ const n=Number(v); v = Number.isFinite(n)?n:null; }
    if (v!=null && (k==="latitude"||k==="longitude")) v = Math.round(v*1e7)/1e7;
    if (v!=null && !NUMERIC.has(k)) v = String(v);
    if (k==="google_maps_url" && v) v = v.replace(/([?&]cid=\d+).*$/,"$1"); // drop long tracking suffix
    o[k]=v;
  }
  return o;
}
// merge b into a: fill empty fields, collect every business type
function mergeInto(a,b){
  for (const k of EXCEL_FIELDS) if ((a[k]==null||a[k]==="") && b[k]!=null && b[k]!=="") a[k]=b[k];
  const ty = [...new Set([...typesOf(a),...typesOf(b)])];
  a.types = ty.length>1 ? ty.join(", ") : (a.types??null);
  return a;
}
function planImport(rows, dedupe){
  const plan = {neu:[],chg:[],same:0,skip:0,dupFile:0,examples:[]};
  // 1) duplicates inside the file
  let uniq = [];
  const fm = makeMatcher();
  for (const raw of rows){
    const r = cleanRow(raw);
    if (!r.name){ plan.skip++; continue; }
    if (dedupe){
      const hit = fm.find(r);
      if (hit){ plan.dupFile++; if(plan.examples.length<8) plan.examples.push(`${hit.name} — ${[...new Set([hit.category,r.category])].filter(Boolean).join(" + ")}`); mergeInto(hit,r); continue; }
      fm.add(r);
    }
    uniq.push(r);
  }
  // 2) compare with what is already in the database (never creates a second copy of an existing shop)
  const em = makeMatcher(); for (const r of state.restaurants.values()) em.add(r);
  for (const r of uniq){
    const ex = em.find(r);
    if (!ex){ plan.neu.push(r); continue; }
    const diff = {};
    for (const k of Object.keys(r)){
      if (k==="number" || r[k]==null) continue; // keep existing numbering; never blank out data
      if (!same(ex[k],r[k])) diff[k]=r[k];
    }
    Object.keys(diff).length ? plan.chg.push([ex.id,diff]) : plan.same++;
  }
  return plan;
}
async function runImport(rows, label){
  let dedupe = true, plan = planImport(rows, dedupe);
  const dupCount = plan.dupFile; // count with dedupe on, shown even if the user turns it off

  const paint = ()=>{

    $("#iSkip").textContent = plan.skip ? `${plan.skip} ${t("importSkipped")}` : "";

  $("#iRun").onclick = async ()=>{

    const by = state.user.email; let maxNo = Math.max(0,...[...state.restaurants.values()].map(r=>Number(r.number)||0));
    const usedIds = new Set(state.restaurants.keys());

      ...plan.neu.map(r=>b=>{

        const ref = id ? doc(RCOL,id) : doc(RCOL); usedIds.add(ref.id);
        if (r.number==null) r.number = ++maxNo;
        b.set(ref, {...Object.fromEntries(EXCEL_FIELDS.map(k=>[k,null])), ...r, status:"new", assignedTo:null, notes:"", source:"excel",
          createdAt:serverTimestamp(), createdBy:by, updatedAt:serverTimestamp(), updatedBy:by}); }),
      ...plan.chg.map(([id,diff])=>b=>b.update(doc(RCOL,id), {...diff, importedAt:serverTimestamp()}))
    ];
    for (let i=0;i<ops.length;i+=450){
      const b = writeBatch(db); ops.slice(i,i+450).forEach(f=>f(b)); await b.commit();
      $("#iProg span").style.width = Math.min(100,Math.round((i+450)*100/ops.length))+"%";
    }
    toast(`${t("imported")}: ${plan.neu.length} ${t("importNew")}, ${plan.chg.length} ${t("importChanged")}`); closeOverlay();
  };
}
$("#btnImport").onclick = ()=>$("#fileIn").click();
$("#fileIn").onchange = async e=>{
  const file = e.target.files[0]; e.target.value=""; if(!file) return;
  const wb = XLSX.read(await file.arrayBuffer(), {type:"array"});
  const hasName = rows => rows.length && Object.keys(rows[0]).some(k=>{ const n=normKey(k); return (ALIASES[n]||n)==="name"; });
  // use the first sheet that has a name column (the summary sheets are skipped)
  let rows = [], sheet = "";
  for (const sn of wb.SheetNames){ const r = XLSX.utils.sheet_to_json(wb.Sheets[sn], {defval:null}); if (hasName(r)){ rows=r; sheet=sn; break; } }
  if (!rows.length){ alert(t("importBad")); return; }
  runImport(rows, `${file.name} · ${sheet} — ${rows.length} rows`);
};
async function loadSeed(){
  const rows = await (await fetch("data/restaurants.json")).json();
  runImport(rows, `data/restaurants.json — ${rows.length} rows`);
}
/* ---------- remove duplicates already in the database ---------- */
function dbDuplicateGroups(){
  const m = makeMatcher(), groups = new Map();
  for (const r of state.restaurants.values()){
    const hit = m.find(r);
    if (hit){ (groups.get(hit.id)||groups.set(hit.id,[hit]).get(hit.id)).push(r); } else m.add(r);
  }
  const work = r => (r.status&&r.status!=="new"?4:0)+(r.assignedTo?2:0)+(r.notes?1:0);
  return [...groups.values()].map(g=>{
    g.sort((a,b)=>work(b)-work(a) || toMs(a.createdAt)-toMs(b.createdAt) || (Number(a.number)||1e9)-(Number(b.number)||1e9));
    return {keep:g[0], drop:g.slice(1)};
  });
}
$("#btnDedup").onclick = ()=>{
  const groups = dbDuplicateGroups(), nDrop = groups.reduce((n,g)=>n+g.drop.length,0);
  openOverlay(`<div class="scrim"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ddTitle"><div class="box">
    <h2 id="ddTitle">${t("dupTitle")}</h2><p>${groups.length?t("dedupText"):t("dedupNone")}</p>
    ${groups.length?`<div class="stats" style="grid-template-columns:1fr 1fr"><div><b class="num">${groups.length}</b><span>${t("dedupGroups")}</span></div><div><b class="num">${nDrop}</b><span>${t("dedupRemove")}</span></div></div>
      <ul class="duplist">${groups.slice(0,10).map(g=>`<li>${esc(g.keep.name)} ×${g.drop.length+1}</li>`).join("")}${groups.length>10?"<li>…</li>":""}</ul>`:""}
    <div class="progress hidden" id="ddProg"><span></span></div>
    <div class="row-end"><button class="btn" data-close>${groups.length?t("cancel"):t("close")}</button>${groups.length?`<button class="btn primary" id="ddRun">${t("dedupRun")}</button>`:""}</div></div></div>`);
  if (!groups.length) return;
  $("#ddRun").onclick = async ()=>{
    $("#ddRun").disabled = true; show("#ddProg");
    const by = state.user.email, ops = [];
    for (const {keep,drop} of groups){
      const merged = {...keep}; drop.forEach(d=>mergeInto(merged,d));
      const upd = {}; for (const k of [...EXCEL_FIELDS]) if (!same(merged[k],keep[k])) upd[k]=merged[k];
      if (!keep.assignedTo){ const a = drop.find(d=>d.assignedTo); if (a) upd.assignedTo = a.assignedTo; }
      const notes = [keep.notes, ...drop.map(d=>d.notes)].filter(Boolean); const n = [...new Set(notes)].join(" | ");
      if (n !== (keep.notes||"")) upd.notes = n;
      if (Object.keys(upd).length) ops.push(b=>b.update(doc(RCOL,keep.id), {...upd, updatedAt:serverTimestamp(), updatedBy:by}));
      drop.forEach(d=>ops.push(b=>b.delete(doc(RCOL,d.id))));
    }
    for (let i=0;i<ops.length;i+=450){
      const b = writeBatch(db); ops.slice(i,i+450).forEach(f=>f(b)); await b.commit();
      $("#ddProg span").style.width = Math.min(100,Math.round((i+450)*100/ops.length))+"%";
    }
    state.selected.clear(); toast(`${t("dedupDone")}: ${nDrop}`); closeOverlay();
  };
};
$("#btnExport").onclick = ()=>{
  const {list} = filtered();
  const data = list.map(r=>{ const o={}; for (const k of EXCEL_FIELDS) o[k==="gstatus"?"status":k]=r[k]??"";
    const g=groupOf(r); o.nearby_group = g&&g.id!=="iso" ? g.n : ""; if(state.near) o.distance_m = Math.round(distM(state.near,r));
    o.assigned_to = agentName(r.assignedTo); o.work_status = sLabel(r.status); o.notes = r.notes||""; o.updated = fmtDate(r.updatedAt); return o; });
  const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "restaurants");
  XLSX.writeFile(wb, `rably-restaurants-${new Date().toISOString().slice(0,10)}.xlsx`);
};

/* =========================================================
   Map
   ========================================================= */
let map, layer;
function renderMap(){
  if (!map){
    map = L.map("map",{preferCanvas:true}).setView([33.5138,36.2765],12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  setTimeout(()=>map.invalidateSize(),0);
  layer.clearLayers();
  if (state.near) L.circle([state.near.latitude,state.near.longitude],{radius:state.near.r,color:"#3D5AFE",weight:1.5,fillOpacity:.06}).addTo(layer);
  const css = getComputedStyle(document.documentElement);
  const pts = [];
  filtered().list.forEach(r=>{
    if (r.latitude==null||r.longitude==null) return;
    const s = r.status||"new"; pts.push([r.latitude,r.longitude]);
    L.circleMarker([r.latitude,r.longitude],{radius:7,weight:1.5,color:"#fff",fillColor:css.getPropertyValue("--s-"+s).trim(),fillOpacity:.95})
      .bindPopup(`<b>${esc(r.name)}</b><br>${esc(typesOf(r).join("، "))}<br>${esc(sLabel(s))} — ${esc(agentName(r.assignedTo)||t("unassigned"))}<br><a href="#" data-open="${esc(r.id)}">${t("edit")}</a> · <a href="#" data-near="${esc(r.id)}">📍 ${t("showNearby")}</a>`)
      .addTo(layer);
  });
  lastPts = pts;
}
let lastPts = [];
function fitMap(){ if(!map) return; renderMap(); if(lastPts.length) setTimeout(()=>map.fitBounds(lastPts,{padding:[40,40],maxZoom:17}),30); }
$("#map").addEventListener("click",e=>{ const a=e.target.closest("[data-open]"); if(a){ e.preventDefault(); openRestaurant(a.dataset.open); }
  const n=e.target.closest("[data-near]"); if(n){ e.preventDefault(); map.closePopup(); setNear(n.dataset.near); }});

/* =========================================================
   Team
   ========================================================= */
function renderTeam(){
  const agents = [...state.agents.values()].sort((a,b)=>(a.active===false)-(b.active===false) || a.name.localeCompare(b.name,LANG));
  if (!agents.length){ $("#team").innerHTML = `<div class="empty" style="grid-column:1/-1"><strong>${t("noAgents")}</strong>${t("noAgentsText")}</div>`; return; }
  const by = {}; for (const r of state.restaurants.values()) if (r.assignedTo){ (by[r.assignedTo] ||= Object.fromEntries(STATUSES.map(s=>[s,0])))[r.status||"new"]++; }
  $("#team").innerHTML = agents.map(a=>{
    const c = by[a.id] || Object.fromEntries(STATUSES.map(s=>[s,0])); const tot = STATUSES.reduce((n,s)=>n+c[s],0);
    return `<div class="agent${a.active===false?" off":""}">
      <h3>${esc(a.name)}</h3><div class="meta" dir="auto">${esc([a.phone,a.email].filter(Boolean).join(" — "))}${a.active===false?" — "+t("inactive"):""}</div>
      <div class="mini">${STATUSES.map(s=>`<span style="flex-grow:${c[s]};background:var(--s-${s})"></span>`).join("")}</div>
      <div class="counts"><strong class="num">${tot} ${t("assignedTotal")}</strong>${STATUSES.filter(s=>c[s]).map(s=>`<span><span class="dot" style="background:var(--s-${s})"></span>${esc(sLabel(s))} ${c[s]}</span>`).join("")}</div>
      <div class="actions"><button class="btn" data-view="${a.id}">${t("viewList")}</button><button class="btn" data-edit="${a.id}">${t("edit")}</button>
        <button class="btn" data-toggle="${a.id}">${a.active===false?t("activate"):t("deactivate")}</button></div></div>`;
  }).join("");
}
$("#team").addEventListener("click",async e=>{
  const v=e.target.closest("[data-view]"), ed=e.target.closest("[data-edit]"), tg=e.target.closest("[data-toggle]");
  if (v){ state.fAgent=v.dataset.view; setTab("list"); renderAll(); }
  if (ed) agentForm(state.agents.get(ed.dataset.edit));
  if (tg){ const a=state.agents.get(tg.dataset.toggle); await updateDoc(doc(ACOL,a.id),{active:a.active===false}); }
});
function agentForm(a){
  openOverlay(`<div class="scrim"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="aTitle"><form class="box" id="aForm">
    <h2 id="aTitle">${a?t("editAgent"):t("addAgent")}</h2>
    <label for="aName">${t("agentName")}</label><input id="aName" required value="${esc(a?.name||"")}">
    <label for="aPhone">${t("agentPhone")}</label><input id="aPhone" dir="ltr" value="${esc(a?.phone||"")}">
    <label for="aEmail">${t("agentEmail")}</label><input id="aEmail" type="email" dir="ltr" value="${esc(a?.email||"")}">
    <div class="row-end"><button type="button" class="btn" data-close>${t("cancel")}</button><button class="btn primary" type="submit">${t("save")}</button></div></form></div>`);
  $("#aName").focus();
  $("#aForm").onsubmit = async e=>{
    e.preventDefault();
    const data = {name:$("#aName").value.trim(), phone:$("#aPhone").value.trim(), email:$("#aEmail").value.trim().toLowerCase()};
    if (a) await updateDoc(doc(ACOL,a.id), data); else await addDoc(ACOL, {...data, active:true, createdAt:serverTimestamp()});
    toast(t("saved")); closeOverlay();
  };
}
$("#btnAddAgent").onclick = ()=>agentForm(null);

window.addEventListener("unhandledrejection", e=>{ if (e.reason && (e.reason.code||e.reason.name==="FirebaseError")) { dbError(e.reason); closeOverlay(); } });

/* =========================================================
   Tabs
   ========================================================= */
function setTab(tab){
  state.tab = tab;
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  ["list","map","team"].forEach(v=>show("#view-"+v, v===tab));
  show("#toolbar", tab!=="team");
  if (tab==="map"){ renderMap(); if(state.fGroup||state.near) fitMap(); }
  if (tab==="team") renderTeam();
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
</script>
